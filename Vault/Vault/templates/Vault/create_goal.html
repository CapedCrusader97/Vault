{% extends 'Vault/base.html' %}
{% block content %}
<div class="flex justify-center mb-12">
    <div class="glass-panel p-8 w-full max-w-lg relative">
        <div class="mb-6 border-b border-gray-700 pb-4 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-white">New Savings Goal</h2>
            <a href="{% url 'dashboard' %}" class="text-gray-400 hover:text-white transition">Cancel</a>
        </div>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">{{ form.name.label }}</label>
                {{ form.name }}
            </div>
            
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">{{ form.target_amount.label }}</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">₹</span>
                    {{ form.target_amount }}
                </div>
            </div>

            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">{{ form.target_date.label }}</label>
                {{ form.target_date }}
                <p class="mt-1 text-xs text-gray-500">Optional deadline for your goal.</p>
            </div>
            
            <button type="submit" class="w-full text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 font-medium rounded-lg text-sm px-5 py-3 text-center transition shadow-lg">Start Saving</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.classList.add('bg-vault-900', 'border', 'border-gray-700', 'text-white', 'sm:text-sm', 'rounded-lg', 'focus:ring-blue-500', 'focus:border-blue-500', 'block', 'w-full', 'p-2.5');
            input.classList.remove('form-control');
        });
        
        const tgtAmt = document.getElementById('{{ form.target_amount.id_for_label }}');
        if (tgtAmt) tgtAmt.classList.add('pl-8');
    });
</script>
{% endblock %}
