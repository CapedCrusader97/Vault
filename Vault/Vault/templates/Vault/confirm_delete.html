{% extends 'Vault/base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh] py-12">
    <div class="w-full max-w-2xl px-6 py-10 glass-panel border border-white/10 shadow-2xl">
        <div class="text-center mb-8">
            <p class="text-sm uppercase tracking-[0.35em] text-blue-300 mb-3">Confirm Deletion</p>
            <h1 class="text-3xl font-semibold text-white">Are you sure?</h1>
        </div>

        <div class="space-y-5 text-center">
            <p class="text-base text-gray-300">You are about to delete the record for:</p>
            <p class="text-xl font-semibold text-white">{{ expense.title }}</p>
            <div class="mx-auto inline-flex items-center gap-2 rounded-3xl bg-yellow-500/10 px-4 py-3 text-sm text-yellow-200 border border-yellow-400/20">
                <span class="text-lg">⚠️</span>
                <span>This action cannot be undone.</span>
            </div>
            <p class="text-sm text-gray-400">Choose one of the options below to continue.</p>
        </div>

        <form method="POST" class="mt-8">
            {% csrf_token %}
            <div class="grid gap-3 sm:grid-cols-2">
                <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center rounded-full border border-white/10 bg-white/5 px-6 py-3 text-sm font-medium text-gray-200 transition hover:bg-white/10">Cancel</a>
                <button type="submit" class="inline-flex items-center justify-center rounded-full bg-red-500 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-red-500/20 transition hover:bg-red-400">Yes, Delete Record</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
