{% extends 'Vault/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white pt-3 pb-2 text-center">
                <h4 class="mb-0">Security Questions</h4>
            </div>
            <div class="card-body p-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                <p class="text-muted text-center mb-4">Please answer the security questions you set up during registration.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="fw-bold text-secondary">1. What is your mother's maiden name?</label>
                        <input type="text" name="q1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold text-secondary">2. What was the name of your first pet?</label>
                        <input type="text" name="q2" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold text-secondary">3. In what city were you born?</label>
                        <input type="text" name="q3" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Verify Answers</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
