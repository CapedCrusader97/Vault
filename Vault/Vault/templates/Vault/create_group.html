{% extends 'Vault/base.html' %}
{% block content %}
<div class="flex justify-center mb-12">
    <div class="glass-panel p-8 w-full max-w-lg relative">
        <div class="mb-6 border-b border-gray-700 pb-4 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-white">Create Group</h2>
            <a href="{% url 'groups_dashboard' %}" class="text-gray-400 hover:text-white transition">Cancel</a>
        </div>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">{{ form.name.label }}</label>
                {{ form.name }}
            </div>
            
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">{{ form.members.label }}</label>
                <div class="bg-vault-900/50 border border-gray-700 rounded-lg p-3 max-h-40 overflow-y-auto split-friends-list">
                    {{ form.members }}
                </div>
            </div>
            
            <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-3 text-center transition">Save Group</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach(input => {
            input.classList.add('bg-vault-900', 'border', 'border-gray-700', 'text-white', 'sm:text-sm', 'rounded-lg', 'focus:ring-blue-500', 'focus:border-blue-500', 'block', 'w-full', 'p-2.5');
            input.classList.remove('form-control');
        });

        const splitList = document.querySelector('.split-friends-list ul');
        if (splitList) {
            splitList.classList.add('space-y-2');
            splitList.querySelectorAll('li').forEach(li => {
                li.classList.add('flex', 'items-center', 'gap-3');
                const label = li.querySelector('label');
                if(label) label.classList.add('text-sm', 'text-gray-300', 'cursor-pointer', 'w-full');
            });
        }
    });
</script>
{% endblock %}
