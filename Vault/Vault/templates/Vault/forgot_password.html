{% extends 'Vault/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white pt-3 pb-2 text-center">
                <h4 class="mb-0">Account Recovery</h4>
            </div>
            <div class="card-body p-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                <p class="text-muted">Enter your username to begin the recovery process.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="fw-bold text-secondary">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Find My Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
