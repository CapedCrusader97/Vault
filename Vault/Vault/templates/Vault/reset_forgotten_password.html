{% extends 'Vault/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white pt-3 pb-2 text-center">
                <h4 class="mb-0">Reset Password</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger">Please correct the errors below.</div>
                    {% endif %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="fw-bold text-secondary">{{ field.label }}</label>
                            <input type="password" name="{{ field.html_name }}" class="form-control" required>
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Save New Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
